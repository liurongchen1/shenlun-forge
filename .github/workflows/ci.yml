name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Version consistency
        run: python scripts/check_version.py

      - name: Tests (unit + compression regression, no credentials needed)
        run: pytest tests/ -q

      - name: Examples run without credentials
        run: |
          unset SHENLUN_FORGE_API_KEY OPENAI_API_KEY
          python examples/quickstart_no_llm.py > /dev/null
          python examples/compress_before_llm.py > /dev/null
          python examples/langchain_middleware.py > /dev/null
          python examples/demo.py > /dev/null

  package:
    name: build and verify distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Install the built wheel and smoke test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import shenlun_forge; print('import ok', shenlun_forge.__version__)"
          /tmp/wheel-venv/bin/shenlun-forge version
          /tmp/wheel-venv/bin/shenlun-forge strategies
