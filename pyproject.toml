[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenlun-forge"
version = "0.2.4"
description = "Task-driven context compression for LLM agents with analytical compression strategy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Liu Rongchen", email = "rederdan@coze.email"},
]
keywords = ["llm", "context", "compression", "agent", "acs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.1"]
full = ["openai>=1.0", "langchain-core>=0.1", "anthropic>=0.20"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
shenlun-forge = "shenlun_forge.cli:main"

[project.urls]
Homepage = "https://github.com/liurongchen1/shenlun-forge"
Repository = "https://github.com/liurongchen1/shenlun-forge"

[tool.setuptools.packages.find]
include = ["shenlun_forge*"]
